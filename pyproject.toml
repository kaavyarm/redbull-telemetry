[tool.ruff]
line-length = 115
target-version = "py311"
exclude = [".venv", "data", "node_modules", "dist"]

[tool.ruff.lint]
# Default rule set (E4/E7/E9 correctness + F pyflakes) plus a few that catch
# real bugs this project has actually hit: B (bugbear -- mutable defaults,
# broad excepts) and SIM (obvious simplifications). Not adding import-sort
# (I) or docstring (D) rules -- this codebase's comment style already
# explains the "why" inline; enforcing docstring presence would just add
# noise without adding real signal.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "E731",  # lambda assignment -- used deliberately in a couple of small transforms
]

[tool.ruff.lint.per-file-ignores]
# B008 (function-call-in-default-arg) is a real footgun for *mutable*
# defaults; the test helpers it flags here call td() (-> pd.Timedelta),
# which is immutable, so there's no shared-mutable-state risk it's meant
# to catch.
"tests/*.py" = ["B008"]
